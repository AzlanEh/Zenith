name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  quality-gates:
    name: Release Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend checks
        run: npm run lint && npm run typecheck && npm run test:run

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Frontend E2E tests
        run: npm run test:e2e

      - name: Frontend production dependency audit
        run: npm run audit:prod

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --all-features

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Rust dependency audit
        working-directory: src-tauri
        run: cargo audit

  create-release:
    name: Create Release
    needs: quality-gates
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create-release.outputs.id }}
      upload_url: ${{ steps.create-release.outputs.upload_url }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: create-release
        uses: softprops/action-gh-release@v2
        with:
          name: wellbeing v${{ steps.version.outputs.version }}
          draft: true
          prerelease: false
          generate_release_notes: true

  update-pkgver:
    name: Sync pkgver in PKGBUILD
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update pkgver
        run: |
          VERSION=${{ needs.create-release.outputs.version }}
          sed -i "s/^pkgver=.*/pkgver=${VERSION}/" pkg/linux/arch/PKGBUILD

      - name: Commit and push updated PKGBUILD
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pkg/linux/arch/PKGBUILD
          git diff --cached --quiet || git commit -m "chore: sync PKGBUILD pkgver to ${{ needs.create-release.outputs.version }}"
          git push origin main

  build:
    name: Build (${{ matrix.config.name }})
    needs: [create-release, update-pkgver]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Linux
            platform: ubuntu-22.04
            args: ""
          - name: Windows
            platform: windows-latest
            args: ""

    runs-on: ${{ matrix.config.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: matrix.config.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxss-dev libx11-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          prefix-key: "v2-rust"

      - name: Install frontend dependencies
        run: npm ci

      - name: Fail when signing secrets are missing
        run: |
          test -n "$TAURI_SIGNING_PRIVATE_KEY" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY" && exit 1)
          test -n "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" || (echo "Missing TAURI_SIGNING_PRIVATE_KEY_PASSWORD" && exit 1)
          echo "TAURI signing secrets detected."
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.config.args }}

  build-arch:
    name: Build (Arch Linux)
    needs: [create-release, update-pkgver]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm base-devel git sudo nodejs npm curl \
            webkit2gtk-4.1 gtk3 libappindicator-gtk3 librsvg \
            libayatana-appindicator appmenu-gtk-module libnotify \
            pkg-config openssl libxss

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Create build user (makepkg refuses to run as root)
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Setup Rust as builder user
        run: |
          su builder -c "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable"

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: /home/builder/.cargo/registry
          key: arch-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: arch-cargo-

      - name: Build PKGBUILD
        run: su builder -s /bin/bash -c "export PATH=/home/builder/.cargo/bin:\$PATH && cd $(pwd)/pkg/linux/arch && makepkg -s --noconfirm --noprogressbar"

      - name: Upload Arch package to release
        uses: softprops/action-gh-release@v2
        with:
          files: pkg/linux/arch/wellbeing-*.pkg.tar.zst
          release_id: ${{ needs.create-release.outputs.release_id }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish Release
    needs: [create-release, build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "v${{ needs.create-release.outputs.version }}" --dir release-assets

      - name: Generate SHA256 checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt

      - name: Install Syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate SBOM (SPDX JSON)
        run: syft dir:. -o spdx-json=sbom.spdx.json

      - name: Upload integrity artifacts to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.create-release.outputs.version }}" release-assets/SHA256SUMS.txt sbom.spdx.json --clobber

      - name: Publish release
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              draft: false
            });
