name: Bug report
description: Report a bug or unexpected behavior in Zenith
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue. Please fill out the form below.
  - type: input
    id: version
    attributes:
      label: App version
      description: Version shown in Settings → Software (e.g. 0.1.5)
      placeholder: 0.1.5
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS / Desktop environment
      description: e.g. Arch Linux + Hyprland, Ubuntu + GNOME, Windows 11
      placeholder: Arch Linux / Hyprland
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened and what did you expect to happen?
      placeholder: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Minimum steps to trigger the bug.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Output from `zenith` launched in a terminal, or app logs.
      render: shell
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain the problem.
